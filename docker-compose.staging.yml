##
## docker-compose.staging.yml
##
## Staging environment with seeded database, Redis, backend API, and frontend.
## Use: docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
##
## Differences from base docker-compose.yml:
##   - SEED_DB=true so the DB is pre-populated with sample data on first start
##   - NODE_ENV=staging
##   - Volumes prefixed with "staging_" to isolate from local dev data
##   - Backend and frontend services included
##
version: '3.9'

services:
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sahulat_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-staging_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-sahulat_staging}
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahulat_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    volumes:
      - staging_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sahulat_backend_staging
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: staging
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-sahulat_staging}:${POSTGRES_PASSWORD:-staging_secret_change_me}@postgres:5432/${POSTGRES_DB:-sahulat_staging}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_32_BYTES_RANDOM_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      SEED_DB: "true"
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sahulat_frontend_staging
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000/api
      NODE_ENV: staging
    ports:
      - "3000:3000"

volumes:
  staging_pgdata:
  staging_redisdata:
